<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F2F6FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1524" media="(prefers-color-scheme: dark)">
<meta name="description" content="Finances d'autònom de Samyama: moviments, models 303, 130, 111 i 115, i previsió.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Comptes">
<style>:root{padding-top:env(safe-area-inset-top,0px)}</style>
</head>
<body>
<title>Samyama Comptes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Jost:wght@300;400;500;600&display=swap">
<style>
/* Layout: una sola columna d'app mòbil (màx. 600px), capçalera enganxosa, barra de pestanyes inferior i full lliscant per afegir moviments */
:root{
  --bg:#F2F6FA; --surface:#FFFFFF; --surface-2:#E8F0F8; --line:#D5E1EC;
  --ink:#172B47; --ink-2:#4B6080; --ink-3:#8496AE;
  --sky:#68ACE5; --sky-ink:#2B76B8; --sky-soft:#DCEBF8;
  --indigo:#21406A; --hero:#21406A; --hero-ink:#F3F8FD; --hero-dim:#A9C3E0;
  --pos:#2E8F72; --pos-soft:#DDF1EA; --neg:#BF5B50; --neg-soft:#F8E4E1; --warn:#B87A1F; --warn-soft:#F7EBD6;
  --shadow:0 1px 2px rgba(23,43,71,.05),0 8px 24px -12px rgba(23,43,71,.18);
  --f-display:"Cormorant Garamond","Cormorant",Garamond,"Times New Roman",serif;
  --f-ui:"Jost","Avenir Next","Segoe UI",system-ui,sans-serif;
  --r:16px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1524; --surface:#122139; --surface-2:#192C49; --line:#243A5B;
  --ink:#E7EFF9; --ink-2:#A9BCD6; --ink-3:#6D84A5;
  --sky:#79B9EE; --sky-ink:#8CC5F2; --sky-soft:#1C3555;
  --indigo:#C8DBF2; --hero:#173054; --hero-ink:#F3F8FD; --hero-dim:#93AFD1;
  --pos:#55C39F; --pos-soft:#15352E; --neg:#E8897D; --neg-soft:#3A2228; --warn:#E5AA52; --warn-soft:#3A2E1A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1524; --surface:#122139; --surface-2:#192C49; --line:#243A5B;
  --ink:#E7EFF9; --ink-2:#A9BCD6; --ink-3:#6D84A5;
  --sky:#79B9EE; --sky-ink:#8CC5F2; --sky-soft:#1C3555;
  --indigo:#C8DBF2; --hero:#173054; --hero-ink:#F3F8FD; --hero-dim:#93AFD1;
  --pos:#55C39F; --pos-soft:#15352E; --neg:#E8897D; --neg-soft:#3A2228; --warn:#E5AA52; --warn-soft:#3A2E1A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6); color-scheme:dark}

[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums lining-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}

.app{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(110px + env(safe-area-inset-bottom,0px))}

/* Capçalera */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 12px;margin-inline:-4px;padding-inline:4px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand .word{font-family:var(--f-display);font-style:italic;font-weight:600;font-size:28px;line-height:1;color:var(--sky-ink);letter-spacing:.2px}
.brand .tag{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
.yearsel{appearance:none;-webkit-appearance:none;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 30px 6px 14px;font-weight:500;font-size:14px;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px;background-repeat:no-repeat}

.banner{display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--warn-soft);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:14px}
.banner b{color:var(--warn)}
.banner button{flex:none;border:0;background:var(--surface);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:500;box-shadow:var(--shadow)}

.view{display:flex;flex-direction:column;gap:14px;animation:fade .35s ease both}
@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.view{animation:none}*{transition:none!important}}

.card{background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
.h2{font-family:var(--f-display);font-weight:600;font-size:23px;line-height:1.1;margin:0;text-wrap:balance}
.muted{color:var(--ink-2)}
.small{font-size:12.5px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.card-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}

/* Hero */
.hero{background:var(--hero);color:var(--hero-ink);border-radius:22px;padding:20px 18px 18px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.hero::after{content:"";position:absolute;right:-70px;top:-70px;width:230px;height:230px;border-radius:50%;border:1px solid rgba(121,185,238,.28);box-shadow:0 0 0 22px rgba(121,185,238,.06),0 0 0 46px rgba(121,185,238,.04);pointer-events:none}
.hero .eyebrow{color:var(--hero-dim)}
.big{font-family:var(--f-display);font-weight:600;font-size:clamp(46px,13vw,64px);line-height:1;letter-spacing:-.5px;margin:8px 0 4px;position:relative}
.big .cts{font-size:.48em;opacity:.7;margin-left:2px}
.hero .sub{color:var(--hero-dim);font-size:13px;position:relative}
.split{display:flex;height:10px;border-radius:99px;overflow:hidden;margin:16px 0 14px;background:rgba(255,255,255,.08);position:relative}
.split i{display:block;height:100%}
.legend{display:grid;grid-template-columns:1fr auto;gap:7px 12px;font-size:13.5px;position:relative}
.legend .k{display:flex;align-items:center;gap:8px;color:var(--hero-dim)}
.legend .k::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--c)}
.legend .v{text-align:right}
.legend .tot{border-top:1px solid rgba(255,255,255,.16);padding-top:8px;color:var(--hero-ink);font-weight:500}

/* Reserva */
.reserve .amt{font-family:var(--f-display);font-weight:600;font-size:40px;line-height:1;color:var(--warn)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:12.5px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.chip b{color:var(--ink);font-weight:500}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat .v{font-family:var(--f-display);font-weight:600;font-size:28px;line-height:1.05;margin-top:4px}
.stat .n{font-size:12.5px;color:var(--ink-2);margin-top:2px}

/* Gràfics */
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .lbl{fill:var(--ink-3);font-family:var(--f-ui);font-size:9.5px}
.chart .lbl.cur{fill:var(--ink);font-weight:600}
.chart .in{fill:var(--sky)}
.chart .out{fill:var(--indigo);opacity:.55}
.chart .pin{fill:none;stroke:var(--sky);stroke-width:1.2;stroke-dasharray:3 2.5}
.chart .pout{fill:none;stroke:var(--ink-3);stroke-width:1.2;stroke-dasharray:3 2.5}
.chart .net{fill:none;stroke:var(--pos);stroke-width:1.6}
.chart .netd{fill:var(--surface);stroke:var(--pos);stroke-width:1.6}
.keys{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--ink-2);margin-top:8px}
.keys span{display:inline-flex;align-items:center;gap:6px}
.keys i{width:10px;height:10px;border-radius:2px;display:inline-block}
.forecast{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;border-top:1px dashed var(--line);padding-top:12px}
.forecast div{min-width:0}
.forecast .v{font-weight:500;font-size:15px}
.cats{display:flex;flex-direction:column;gap:10px}
.cat .row{font-size:13.5px}
.bar{height:6px;border-radius:9px;background:var(--surface-2);margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--indigo);opacity:.6;border-radius:9px}

.disclaimer{font-size:12px;color:var(--ink-3);text-align:center;padding:4px 10px 0;text-wrap:balance}

/* Moviments */
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px}
.search input{flex:1;border:0;background:transparent;padding:11px 0;outline:none;min-width:0}
.filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -2px;padding:2px}
.filters::-webkit-scrollbar{display:none}
.fbtn{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:13.5px;color:var(--ink-2)}
.fbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sumline{display:flex;gap:14px;font-size:13px;color:var(--ink-2);flex-wrap:wrap}
.month{margin-top:4px}
.mhead{display:flex;justify-content:space-between;align-items:baseline;padding:6px 4px 8px}
.mhead .t{font-family:var(--f-display);font-weight:600;font-size:21px;text-transform:capitalize}
.mhead .s{font-size:12.5px;color:var(--ink-3)}
.list{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.mvw{position:relative;overflow:hidden;border-top:1px solid var(--line);background:var(--neg)}
.mvw:first-child{border-top:0}
.mvdel{position:absolute;top:0;right:0;bottom:0;width:96px;border:0;background:var(--neg);color:#fff;font-weight:500;font-size:13.5px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.mvdel svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.mv{position:relative;display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;border:0;background:var(--surface);padding:12px 14px;transition:transform .22s cubic-bezier(.2,.8,.2,1),background .15s;touch-action:pan-y}
.mv.drag{transition:none}
.mv:hover{background:color-mix(in srgb,var(--surface-2) 60%,var(--surface))}
.mv .ck{display:none}
.selmode .mv .d{display:none}
.selmode .mv .ck{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;border:1.5px solid var(--line);color:transparent;font-size:17px;font-weight:600}
.selmode .mv.on{background:var(--neg-soft)}
.selmode .mv.on .ck{background:var(--neg);border-color:var(--neg);color:#fff}
.hint{font-size:12px;color:var(--ink-3);text-align:center}
.selbar{position:fixed;z-index:27;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
.selbar .in{max-width:568px;margin:0 auto 10px;background:var(--ink);color:var(--bg);border-radius:16px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow)}
.selbar .n{flex:1;font-weight:500;font-size:14px;min-width:0}
.selbar .btn{background:transparent;color:var(--bg);border-color:color-mix(in srgb,var(--bg) 30%,transparent)}
.selbar .btn.danger{background:var(--neg);border-color:var(--neg);color:#fff}
.selbar .btn.danger:disabled{opacity:.45}
.selbar .btn.danger.arm{background:#fff;color:var(--neg);border-color:#fff}
.linkbtn{border:0;background:transparent;color:var(--sky-ink);font-weight:500;font-size:13px;padding:0}
.mv .d{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;line-height:1;font-size:15px;font-weight:500;background:var(--surface-2);color:var(--ink-2)}
.mv .d small{display:block;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-top:1px}
.mv.in .d{background:var(--sky-soft);color:var(--sky-ink)}
.mv .m{min-width:0}
.mv .c{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mv .p{font-size:12.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mv .a{text-align:right;font-weight:500;white-space:nowrap}
.mv.in .a{color:var(--pos)}
.mv .tags{display:flex;gap:4px;justify-content:flex-end;margin-top:3px}
.pill{font-size:10.5px;letter-spacing:.04em;padding:2px 7px;border-radius:99px;background:var(--surface-2);color:var(--ink-2);font-weight:500;white-space:nowrap}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.pos{background:var(--pos-soft);color:var(--pos)}
.pill.neg{background:var(--neg-soft);color:var(--neg)}
.pill.sky{background:var(--sky-soft);color:var(--sky-ink)}
.empty{text-align:center;padding:36px 16px;color:var(--ink-2)}
.empty .h2{margin-bottom:6px}

/* Impostos */
.seg{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface-2);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:9px;padding:8px 0;font-weight:500;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.dialcard{display:grid;grid-template-columns:132px 1fr;gap:16px;align-items:center}
.dial{width:132px;height:132px}
.dial .trk{fill:none;stroke:var(--surface-2);stroke-width:9}
.dial .done{fill:none;stroke:var(--sky);stroke-width:9;stroke-linecap:round}
.dial .open{fill:none;stroke:var(--warn);stroke-width:9;stroke-linecap:round}
.dial .late{fill:none;stroke:var(--neg);stroke-width:9;stroke-linecap:round}
.dial .today{fill:var(--ink)}
.dial .ql{fill:var(--ink-3);font-size:10px;font-family:var(--f-ui);font-weight:500}
.dial .ctr{fill:var(--ink);font-family:var(--f-display);font-weight:600;font-size:30px}
.dial .ctr2{fill:var(--ink-2);font-family:var(--f-ui);font-size:10px}
.model{display:flex;flex-direction:column;gap:12px}
.mtop{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:start}
.mno{font-family:var(--f-display);font-weight:600;font-size:38px;line-height:.9;color:var(--sky-ink)}
.mname{font-weight:500}
.mres{text-align:right}
.mres .v{font-family:var(--f-display);font-weight:600;font-size:26px;line-height:1}
.mres .l{font-size:11.5px;color:var(--ink-3);margin-top:3px}
.v.pay{color:var(--ink)} .v.back{color:var(--pos)} .v.zero{color:var(--ink-3)}
.mfoot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
details.boxes summary{cursor:pointer;font-size:13px;color:var(--sky-ink);font-weight:500;list-style:none}
details.boxes summary::-webkit-details-marker{display:none}
details.boxes summary::before{content:"＋ ";}
details.boxes[open] summary::before{content:"－ "}
.btab{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
.btab td{padding:6px 0;border-top:1px solid var(--line);vertical-align:top}
.btab td:first-child{width:46px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.btab td:last-child{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.btab tr.res td{font-weight:600;color:var(--ink)}
.note{font-size:12.5px;color:var(--ink-2);background:var(--surface-2);border-radius:10px;padding:9px 11px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:13.5px;font-weight:500}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--neg);border-color:color-mix(in srgb,var(--neg) 40%,transparent)}
.btn.danger.arm{background:var(--neg);color:#fff;border-color:var(--neg)}
.cal{display:flex;flex-direction:column}
.ci{display:grid;grid-template-columns:54px 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--line);align-items:start}
.ci:first-child{border-top:0}
.ci .dt{font-family:var(--f-display);font-weight:600;font-size:22px;line-height:1;text-align:center}
.ci .dt small{display:block;font-family:var(--f-ui);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:500;margin-top:2px}
.ci.past{opacity:.5}
.ci.next .dt{color:var(--warn)}
.ci .w{font-weight:500}
.ci .chips{margin-top:5px}

/* Ajustos */
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lab{font-size:12.5px;color:var(--ink-2);font-weight:500}
.inp{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:10px 12px;outline:none;min-width:0}
.inp:focus{border-color:var(--sky)}
.set{display:flex;flex-direction:column;gap:16px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:14px}
.switch .txt{min-width:0}
.tog{appearance:none;-webkit-appearance:none;flex:none;width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;transition:background .2s;cursor:pointer;margin:0}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.tog:checked{background:var(--sky)}
.tog:checked::after{transform:translateX(18px)}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;font-size:13.5px;font-weight:500;color:var(--ink-2)}
.opt[aria-pressed="true"]{border-color:var(--sky);background:var(--sky-soft);color:var(--sky-ink)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}

/* Navegació */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs .in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{border:0;background:transparent;padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--ink-3);font-weight:500;letter-spacing:.02em}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--sky-ink)}
.fab{position:fixed;z-index:26;right:max(18px,calc(50% - 282px),env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:20px;border:0;background:var(--sky);color:#fff;box-shadow:0 10px 24px -8px color-mix(in srgb,var(--sky) 70%,transparent),0 2px 6px rgba(0,0,0,.12);display:grid;place-items:center;transition:transform .15s}
.fab:active{transform:scale(.94)}
.fab svg{width:26px;height:26px;stroke:#fff;stroke-width:2.2;stroke-linecap:round}

/* Full lliscant */
.sheet-wrap{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:rgba(8,18,34,.45)}
.sheet{width:100%;max-width:600px;max-height:94%;overflow:auto;background:var(--surface);border-radius:24px 24px 0 0;padding:10px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));animation:up .28s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
.grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sheet form{display:flex;flex-direction:column;gap:14px}
.typeseg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:12px;padding:3px;gap:3px}
.typeseg button{border:0;background:transparent;border-radius:9px;padding:9px 0;font-weight:500;color:var(--ink-2)}
.typeseg button[aria-pressed="true"]{background:var(--surface);box-shadow:var(--shadow);color:var(--ink)}
.typeseg button.in[aria-pressed="true"]{color:var(--pos)}
.typeseg button.out[aria-pressed="true"]{color:var(--neg)}
.amtbox{display:flex;align-items:baseline;gap:6px;border-bottom:1px solid var(--line);padding-bottom:4px}
.amtbox input{flex:1;min-width:0;border:0;background:transparent;font-family:var(--f-display);font-weight:600;font-size:46px;line-height:1.1;outline:none;padding:0}
.amtbox span{font-family:var(--f-display);font-size:28px;color:var(--ink-3)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two>*{min-width:0}
.preview{background:var(--surface-2);border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:13px}
.preview .k{color:var(--ink-2)}
.preview .v{text-align:right;font-variant-numeric:tabular-nums}
.preview .t{font-weight:600;border-top:1px solid var(--line);padding-top:6px;margin-top:2px}
.preview .k.t{margin-right:-10px;padding-right:10px}
.sheet .actions{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-top:2px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;font-size:13.5px;display:flex;gap:14px;align-items:center;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

<script>
(function(){
"use strict";
/* ---------- Constants ---------- */
var KEY='samyama-comptes-v1';
var MES=['gener','febrer','març','abril','maig','juny','juliol','agost','setembre','octubre','novembre','desembre'];
var MESC=['gen','feb','mar','abr','maig','juny','jul','ag','set','oct','nov','des'];
var MESI=['G','F','M','A','M','J','J','A','S','O','N','D'];
var CATS={in:['Classes regulars','Classes particulars','Institucions','Tallers i retirs','Formació online','Altres ingressos'],
 out:['Lloguer local','Subministraments','Telèfon i internet','Material de ioga','Formació','Assessoria','Publicitat i web','Assegurances','Desplaçaments','Altres despeses']};
var RENT='Lloguer local';
/* Taula orientativa RETA 2026 (rendiment net mensual → quota) */
var RETA=[[670,'Reduït 1',205.88],[900,'Reduït 2',226.47],[1166.70,'Reduït 3',267.65],[1300,'General 1',299.56],[1500,'General 2',302.65],[1700,'General 3',302.65],[1850,'General 4',360.29],[2030,'General 5',380.88],[2330,'General 6',401.47],[2760,'General 7',427.21],[3190,'General 8',452.94],[3620,'General 9',478.68],[4050,'General 10',504.41],[6000,'General 11',545.59],[Infinity,'General 12',607.35]];
/* Escala IRPF orientativa: estatal + Catalunya */
var ESC_E=[[12450,.095],[20200,.12],[35200,.15],[60000,.185],[300000,.225],[Infinity,.245]];
var ESC_C=[[12450,.105],[17707.2,.12],[21000,.14],[33007.2,.15],[53407.2,.188],[90000,.215],[120000,.235],[175000,.245],[Infinity,.255]];

/* ---------- Utilitats ---------- */
function $(s,r){return (r||document).querySelector(s)}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
function r2(n){return Math.round((n+Number.EPSILON)*100)/100}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function grp(s){return s.replace(/\B(?=(\d{3})+(?!\d))/g,'.')}
function eur(n,dec){if(dec===undefined)dec=2;var neg=n<0;var a=Math.abs(n);var f=a.toFixed(dec).split('.');return (neg?'−':'')+grp(f[0])+(dec?','+f[1]:'')+' €'}
function eur0(n){return eur(Math.round(n),0)}
function pad(n){return (n<10?'0':'')+n}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parseD(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function qOf(s){return Math.floor((+s.slice(5,7)-1)/3)+1}
function parseNum(s){s=String(s).trim().replace(/\s|€/g,'');if(s.indexOf(',')>-1){s=s.replace(/\./g,'').replace(',','.')}var n=parseFloat(s);return isNaN(n)?NaN:n}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
var TODAY=new Date();TODAY.setHours(0,0,0,0);
var CY=TODAY.getFullYear(),CM=TODAY.getMonth(),CQ=Math.floor(CM/3)+1;
function shiftBiz(d){var w=d.getDay();if(w===6)d.setDate(d.getDate()+2);else if(w===0)d.setDate(d.getDate()+1);return d}
function dayDiff(a,b){return Math.round((b-a)/864e5)}
function fmtDay(d){return d.getDate()+' '+MESC[d.getMonth()]}

/* ---------- Dades d'exemple ---------- */
function sample(){
  var y=CY,mv=[],lastM=(y===CY?CM:11);
  function add(t,m,d,c,p,cat,base,iva,ret,paid,ded){
    var dt=new Date(y,m,d);if(dt>TODAY)return;
    mv.push({id:uid(),t:t,d:iso(dt),c:c,p:p,cat:cat,base:base,iva:iva,ret:ret,paid:paid!==false,ded:ded!==false});}
  var alumnes=[2150,2280,2390,2210,2300,2180,1450,0,1980,2420,2350,1900];
  for(var m=0;m<=lastM;m++){
    var M=MES[m];
    if(alumnes[m])add('in',m,5,'Quotes alumnes de '+M,'Alumnes Samyama','Classes regulars',alumnes[m],21,0);
    if(m!==7)add('in',m,27,'Classes al gimnàs · '+M,'Gimnàs del Fornàs','Institucions',360,21,15,!(m===lastM));
    if(m<6||m>8)add('in',m,26,'Extraescolar de ioga · '+M,'Col·legi Sant Pau','Institucions',280,21,15,!(m===lastM||m===lastM-1));
    add('out',m,1,'Lloguer del local · '+M,'Propietat del local','Lloguer local',600,21,19);
    add('out',m,12,'Fibra i mòbil','Operadora de telefonia','Telèfon i internet',41.32,21,0);
    if(m%2===1)add('out',m,18,'Llum del local','Companyia elèctrica','Subministraments',[0,96.4,0,84.1,0,72.8,0,79.5,0,88.3,0,101.2][m],21,0);
    if(m%3===0)add('out',m,15,'Assessoria fiscal trimestral','Assessoria (professional)','Assessoria',120,21,15);
  }
  add('in',1,14,'Classes particulars (4 sessions)','Alumna particular','Classes particulars',180,21,0);
  add('in',3,22,'Classes particulars (5 sessions)','Alumne particular','Classes particulars',240,21,0);
  add('in',2,21,"Taller d'inversions",'Inscripcions taller','Tallers i retirs',520,21,0);
  add('in',5,21,'Retir de solstici','Inscripcions retir','Tallers i retirs',1150,21,0);
  add('in',7,10,"Intensiu d'estiu",'Inscripcions intensiu','Tallers i retirs',640,21,0);
  add('in',8,24,'Classes particulars (5 sessions)','Alumna particular','Classes particulars',240,21,0);
  add('in',9,18,'Taller de pranayama','Inscripcions taller','Tallers i retirs',390,21,0);
  add('out',0,9,'Domini i allotjament samyamaioga.com','Proveïdor web','Publicitat i web',96,21,0);
  add('out',1,3,'Assegurança de responsabilitat civil','Asseguradora','Assegurances',165,0,0);
  add('out',2,11,'Maons i cinturons Iyengar','Botiga de material','Material de ioga',186,21,0);
  add('out',4,16,'Intensiu Iyengar a Barcelona','Associació Iyengar','Formació',380,0,0);
  add('out',8,4,'Mantes i bolsters','Botiga de material','Material de ioga',240,21,0);
  add('out',8,8,"Fulletons d'inici de curs",'Impremta','Publicitat i web',85,21,0);
  add('out',9,7,'Productes de neteja del local','Supermercat','Altres despeses',34.5,21,0);
  mv.sort(function(a,b){return a.d<b.d?1:-1});
  var filed={};for(var q=1;q<CQ;q++)['303','130','111','115'].forEach(function(k){filed[y+'-'+q+'-'+k]=true});
  return {v:1,sample:true,moves:mv,filed:filed,settings:defaults()};
}
function defaults(){return {year:CY,quota:302.65,autoQuota:true,retDef:15,ivaDef:21,dificil:true}}

/* ---------- Estat ---------- */
var S;
function load(){try{var raw=localStorage.getItem(KEY);if(raw){S=JSON.parse(raw)}}catch(e){}
  var seed=window.__SEED;if(seed&&(!S||!S.moves||S.sample||(!S.moves.length&&S.seedId!==seed.seedId))){S=JSON.parse(JSON.stringify(seed));try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
  if(!S||!S.moves){S=sample()}S.settings=Object.assign(defaults(),S.settings||{});S.filed=S.filed||{};}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
var UI={view:'resum',filter:'all',q:'',tq:null,editing:null,type:'in',iva:21,ret:0};

/* ---------- Càlculs ---------- */
function yr(){return +S.settings.year}
function movesY(y){return S.moves.filter(function(m){return +m.d.slice(0,4)===y})}
function inQ(m,y,q){return +m.d.slice(0,4)===y&&qOf(m.d)===q}
function ivaAmt(m){return m.base*m.iva/100}
function retAmt(m){return m.base*m.ret/100}
function cashAmt(m){return r2(m.base+ivaAmt(m)-retAmt(m))}
function monthsElapsed(y){return y<CY?12:y>CY?0:CM+1}
function quotaMonths(y,upToMonth){/* mesos 0..upToMonth comptats */var lim=y<CY?11:y>CY?-1:CM;return Math.max(0,Math.min(upToMonth,lim)+1)}

function calc303(y,q){
  var r={rates:{},b27:0,b28:0,b29:0,exempt:0};
  S.moves.forEach(function(m){if(!inQ(m,y,q))return;
    if(m.t==='in'){if(m.iva>0){var k=m.iva;r.rates[k]=r.rates[k]||{base:0,quota:0};r.rates[k].base+=m.base;r.rates[k].quota+=ivaAmt(m);r.b27+=ivaAmt(m)}else r.exempt+=m.base}
    else if(m.ded&&m.iva>0){r.b28+=m.base;r.b29+=ivaAmt(m)}});
  r.b45=r.b29;return r;
}
function m303(y,q){var carry=0,out;
  for(var k=1;k<=q;k++){var c=calc303(y,k);var b46=r2(c.b27-c.b45);var ap=b46>0?Math.min(carry,b46):0;var b71=r2(b46-ap);
    if(k===q){c.b46=b46;c.b110=carry;c.b78=ap;c.b71=b71;c.b87=r2(carry-ap);out=c}
    carry=r2(carry-ap+(b46<0?-b46:0));}
  return out;}
function cum130(y,k){var ing=0,desp=0,ret=0,retBase=0;
  S.moves.forEach(function(m){if(+m.d.slice(0,4)!==y||qOf(m.d)>k)return;
    if(m.t==='in'){ing+=m.base;ret+=retAmt(m);if(m.ret>0)retBase+=m.base}else if(m.ded){desp+=m.base;if(m.iva>0&&false)desp+=0}});
  var qm=S.settings.autoQuota?quotaMonths(y,k*3-1):0;var quota=r2(qm*S.settings.quota);
  var pre=ing-desp-quota;var dj=S.settings.dificil?Math.min(2000,Math.max(0,pre*.05)):0;
  var b02=r2(desp+quota+dj);
  return {b01:r2(ing),desp:r2(desp),quota:quota,qm:qm,dj:r2(dj),b02:b02,b03:r2(ing-b02),b06:r2(ret),retShare:ing?retBase/ing:0};}
function m130(y,q){var paid=0,out;
  for(var k=1;k<=q;k++){var c=cum130(y,k);c.b04=r2(Math.max(0,c.b03*.2));c.b05=r2(paid);c.b07=r2(c.b04-c.b05-c.b06);c.pay=Math.max(0,c.b07);
    if(k===q)out=c;paid+=c.pay;}
  return out;}
function mRet(y,q,rent){var ps={},imp=0,ret=0;
  S.moves.forEach(function(m){if(m.t!=='out'||m.ret<=0||!inQ(m,y,q))return;if((m.cat===RENT)!==rent)return;ps[m.p||'—']=1;imp+=m.base;ret+=retAmt(m)});
  return {n:Object.keys(ps).length,imp:r2(imp),ret:r2(ret)};}
function deadline(model,y,q){var d;
  if(q<4)d=new Date(y,q*3,20);else d=(model==='111'||model==='115')?new Date(y+1,0,20):new Date(y+1,0,30);
  return shiftBiz(d);}
function opens(y,q){return q<4?new Date(y,q*3,1):new Date(y+1,0,1)}
function status(model,y,q){var key=y+'-'+q+'-'+model;var dl=deadline(model,y,q),op=opens(y,q);
  if(S.filed[key])return {k:'done',txt:'Presentat',cls:'pos',dl:dl};
  if(TODAY>dl)return {k:'late',txt:'Fora de termini',cls:'neg',dl:dl};
  if(TODAY>=op){var n=dayDiff(TODAY,dl);return {k:'open',txt:n===0?'Avui és l\'últim dia':'Falten '+n+' dies',cls:'warn',dl:dl}}
  return {k:'soon',txt:'S\'obre l\''+op.getDate()+' '+MESC[op.getMonth()],cls:'sky',dl:dl};}
function tax(base,esc){var t=0,prev=0;for(var i=0;i<esc.length;i++){var top=esc[i][0];if(base>prev){t+=(Math.min(base,top)-prev)*esc[i][1]}prev=top}return t}
function irpfAnual(rn){if(rn<=0)return 0;var mpf=5550;return Math.max(0,tax(rn,ESC_E)+tax(rn,ESC_C)-tax(Math.min(rn,mpf),ESC_E)-tax(Math.min(rn,mpf),ESC_C))}

function yearSummary(y){
  var me=monthsElapsed(y),ms=movesY(y),inc=Array(12).fill(0),out=Array(12).fill(0),cats={};
  var fact=0,desp=0,despNoDed=0,pend=0,pendN=0;
  ms.forEach(function(m){var mo=+m.d.slice(5,7)-1;
    if(m.t==='in'){fact+=m.base;inc[mo]+=m.base;if(!m.paid){pend+=cashAmt(m);pendN++}}
    else{var cost=m.base+(m.ded?0:ivaAmt(m));desp+=cost;out[mo]+=cost;cats[m.cat]=(cats[m.cat]||0)+cost;if(!m.ded)despNoDed+=cost}});
  var qm=S.settings.autoQuota?quotaMonths(y,11):0;var quota=qm*S.settings.quota;
  if(S.settings.autoQuota){for(var i=0;i<12;i++){if(i<qm)out[i]+=S.settings.quota}if(quota)cats['Quota d\'autònom']=quota}
  var rnY=fact-(desp-despNoDed)-quota;var dj=S.settings.dificil?Math.min(2000,Math.max(0,rnY*.05)):0;rnY-=dj;
  var div=me||12;var annual=rnY*12/div;var irpfY=irpfAnual(annual);var irpf=me?irpfY*me/12:0;
  var net=fact-desp-quota-irpf;
  /* previsió */
  var proj=Array(12).fill(null);var last=[];for(var k=me-1;k>=0&&last.length<3;k--)last.push(k);
  if(me>0&&me<12){var ai=0,ao=0;last.forEach(function(k){ai+=inc[k];ao+=out[k]});ai/=last.length;ao/=last.length;for(var j=me;j<12;j++)proj[j]={i:ai,o:ao}}
  var endFact=fact,endOut=desp+quota;for(j=me;j<12;j++)if(proj[j]){endFact+=proj[j].i;endOut+=proj[j].o}
  var endRn=endFact-endOut;endRn-=S.settings.dificil?Math.min(2000,Math.max(0,endRn*.05)):0;var endIrpf=irpfAnual(endRn);
  return {me:me,fact:fact,desp:desp,quota:quota,qm:qm,irpf:irpf,irpfRate:annual>0?irpfY/annual:0,net:net,inc:inc,out:out,proj:proj,cats:cats,pend:pend,pendN:pendN,
    endFact:endFact,endNet:endFact-endOut-endIrpf,endIrpf:endIrpf,rnMonthly:me?(fact-(desp-despNoDed))*.93/me:0};}

function chart(s,y){

    '<button type="button" class="btn'+(S.filed[key]?' ghost':'')+'" data-file="'+key+'">'+(S.filed[key]?'Desmarcar':'Marcar com a presentat')+'</button></div></div>';}
function dial(y,q){var cx=66,cy=66,r=52,h='<svg class="dial" viewBox="0 0 132 132" aria-hidden="true"><circle class="trk" cx="'+cx+'" cy="'+cy+'" r="'+r+'"/>';
  function pt(a,rr){var t=(a-90)*Math.PI/180;return [cx+(rr||r)*Math.cos(t),cy+(rr||r)*Math.sin(t)]}
  function arc(a0,a1,c){var p0=pt(a0),p1=pt(a1);return '<path class="'+c+'" d="M'+p0[0].toFixed(2)+' '+p0[1].toFixed(2)+' A'+r+' '+r+' 0 '+(a1-a0>180?1:0)+' 1 '+p1[0].toFixed(2)+' '+p1[1].toFixed(2)+'"/>'}
  for(var k=1;k<=4;k++){var a0=(k-1)*90+7,a1=k*90-7;var ss=['303','130','111','115'].map(function(m){return status(m,y,k).k});
    var c=ss.every(function(s){return s==='done'})?'done':ss.indexOf('late')>-1?'late':ss.indexOf('open')>-1?'open':null;
    if(y===CY&&k===CQ&&c!=='done'){var doy=(TODAY-new Date(CY,0,1))/864e5/365*360;h+=arc(a0,Math.max(a0+1,Math.min(a1,doy)),'open')}
    else if(c)h+=arc(a0,a1,c);
    var lp=pt((k-1)*90+45,r-20);h+='<text class="ql" x="'+lp[0].toFixed(1)+'" y="'+(lp[1]+3.5).toFixed(1)+'" text-anchor="middle">'+k+'T</text>';}
  if(y===CY){var td=pt((TODAY-new Date(CY,0,1))/864e5/365*360);h+='<circle class="today" cx="'+td[0].toFixed(1)+'" cy="'+td[1].toFixed(1)+'" r="4.5"/>'}
  return h+'</svg>';}
function calendar(y){var items=[];
  for(var q=1;q<=3;q++)items.push({d:deadline('303',y,q),w:q+'r trimestre',ms:['303','130','111','115'],q:q});
  items.push({d:deadline('111',y,4),w:'4t trimestre · retencions',ms:['111','115'],q:4});
  items.push({d:deadline('303',y,4),w:'4t trimestre · IVA i IRPF',ms:['303','130'],q:4,extra:'i resum anual 390'});
  items.push({d:shiftBiz(new Date(y+1,0,31)),w:'Resums anuals de retencions',ms:[],extra:'Models 190 i 180'});
  items.push({d:shiftBiz(new Date(y+1,5,30)),w:'Declaració de la renda '+y,ms:[],extra:'Campanya d\'abril a juny'});
  items.sort(function(a,b){return a.d-b.d});
  var nextFound=false;
  return '<div class="card"><div class="card-head"><h2 class="h2">Calendari fiscal</h2><span class="small muted">exercici '+y+'</span></div><div class="cal">'+items.map(function(it){
    var past=it.d<TODAY,allDone=it.ms.length&&it.ms.every(function(m){return S.filed[y+'-'+it.q+'-'+m]});var cls='';
    if(past||allDone)cls='past';else if(!nextFound){cls='next';nextFound=true}
    return '<div class="ci '+cls+'"><div class="dt num">'+it.d.getDate()+'<small>'+MESC[it.d.getMonth()]+(it.d.getFullYear()!==y?' '+String(it.d.getFullYear()).slice(2):'')+'</small></div><div><div class="w">'+esc(it.w)+'</div>'+
      (it.extra?'<div class="small muted">'+esc(it.extra)+'</div>':'')+
      (it.ms.length?'<div class="chips">'+it.ms.map(function(m){var f=S.filed[y+'-'+it.q+'-'+m];return '<span class="pill '+(f?'pos':'')+'">'+m+(f?' ✓':'')+'</span>'}).join('')+'</div>':'')+'</div></div>'}).join('')+'</div></div>';}

/* ---------- Render: Ajustos ---------- */
var deferredPrompt=null;
function renderAjustos(){
  var st=S.settings,el=$('#v-ajustos'),s=yearSummary(CY);var tram=RETA.filter(function(t){return s.rnMonthly<=t[0]})[0];
  var h='<div class="card set"><h2 class="h2">Autònom</h2>'+
    '<div class="field"><label for="s-quota">Quota d\'autònom mensual</label><input class="inp num" id="s-quota" inputmode="decimal" value="'+String(st.quota).replace('.',',')+'"></div>'+
    (s.me&&tram?'<div class="note">Amb un rendiment net mitjà de <b class="num">'+eur0(s.rnMonthly)+'</b> al mes, el tram orientatiu és <b>'+tram[1]+'</b>: <b class="num">'+eur(tram[2])+'</b> al mes. <button type="button" class="btn" style="margin-top:8px;display:block" id="applyTram" data-v="'+tram[2]+'">Fer servir aquesta quota</button></div>':'')+
    '<div class="switch"><div class="txt"><div>Comptar la quota com a despesa</div><div class="small muted">S\'afegeix sola cada mes al càlcul de l\'IRPF</div></div><input type="checkbox" class="tog" id="s-auto"'+(st.autoQuota?' checked':'')+'></div>'+
    '<div class="switch"><div class="txt"><div>Despeses de difícil justificació</div><div class="small muted">5% del rendiment, fins a 2.000 € l\'any (estimació directa simplificada)</div></div><input type="checkbox" class="tog" id="s-dj"'+(st.dificil?' checked':'')+'></div>'+
    '<div class="field"><span class="lab">Retenció a les teves factures a empreses</span><div class="opts">'+[[15,'15% general'],[7,'7% nou autònom']].map(function(o){return '<button type="button" class="opt" data-set="retDef" data-v="'+o[0]+'" aria-pressed="'+(st.retDef===o[0])+'">'+o[1]+'</button>'}).join('')+'</div><div class="small muted">El 7% s\'aplica l\'any d\'alta i els dos següents.</div></div>'+
    '<div class="field"><span class="lab">IVA per defecte als ingressos</span><div class="opts">'+[21,10,0].map(function(v){return '<button type="button" class="opt" data-set="ivaDef" data-v="'+v+'" aria-pressed="'+(st.ivaDef===v)+'">'+(v?v+'%':'Exempt')+'</button>'}).join('')+'</div></div></div>';
  h+='<div class="card set"><h2 class="h2">Les teves dades</h2><p class="small muted" style="margin:0">Tot es guarda només en aquest dispositiu. Fes una còpia de tant en tant.</p>'+
    '<div class="btnrow"><button type="button" class="btn" id="exp">Desar còpia (.json)</button><button type="button" class="btn" id="cpy">Copiar dades</button><label class="btn" for="imp" style="cursor:pointer">Restaurar còpia</label><input type="file" id="imp" accept="application/json,.json" hidden></div>'+
    '<div class="btnrow"><button type="button" class="btn" id="loadSample">Carregar dades d\'exemple</button><button type="button" class="btn danger" id="wipe">Esborrar-ho tot</button></div>'+
    '<div id="installRow"'+(deferredPrompt?'':' hidden')+'><button type="button" class="btn primary" id="install">Instal·lar al mòbil</button></div></div>';
  h+='<p class="disclaimer">Samyama Comptes · càlculs orientatius per a un autònom en estimació directa simplificada a Catalunya. No substitueix el teu assessor fiscal.</p>';
  el.innerHTML=h;
  $('#s-quota').addEventListener('change',function(e){var v=parseNum(e.target.value);if(!isNaN(v)&&v>=0){S.settings.quota=r2(v);commit('Quota actualitzada')}else{toast('Escriu un import vàlid, per exemple 302,65')}});
  $('#s-auto').addEventListener('change',function(e){S.settings.autoQuota=e.target.checked;commit()});
  $('#s-dj').addEventListener('change',function(e){S.settings.dificil=e.target.checked;commit()});
  var ap=$('#applyTram');if(ap)ap.addEventListener('click',function(){S.settings.quota=+ap.dataset.v;commit('Quota actualitzada')});
  $('#exp').addEventListener('click',exportFile);
  $('#cpy').addEventListener('click',function(){var t=JSON.stringify(S);try{navigator.clipboard.writeText(t).then(function(){toast('Dades copiades')},function(){toast('No s\'ha pogut copiar')})}catch(e){toast('No s\'ha pogut copiar')}});
  $('#imp').addEventListener('change',importFile);
  armBtn($('#loadSample'),'Confirma: substituir',function(){S=sample();UI.tq=null;commit('Dades d\'exemple carregades')});
  armBtn($('#wipe'),'Confirma: esborrar',function(){var snap=JSON.parse(JSON.stringify(S));S={v:1,sample:false,moves:[],filed:{},settings:Object.assign(defaults(),{quota:S.settings.quota,retDef:S.settings.retDef,ivaDef:S.settings.ivaDef})};save();render();
    toast('Tot esborrat',function(){S=snap;commit('Dades recuperades')})});
  var ib=$('#install');if(ib)ib.addEventListener('click',function(){if(!deferredPrompt)return;deferredPrompt.prompt();deferredPrompt=null;$('#installRow').hidden=true});
}
function armBtn(b,txt,fn){var orig=b.textContent,t;b.addEventListener('click',function(){if(b.classList.contains('arm')){clearTimeout(t);fn()}else{b.classList.add('arm');b.classList.add('danger');b.textContent=txt;t=setTimeout(function(){b.classList.remove('arm');b.textContent=orig},3500)}})}
function exportFile(){try{var blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='samyama-comptes-'+iso(TODAY)+'.json';document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500);toast('Còpia desada')}catch(e){toast('No s\'ha pogut desar. Fes servir «Copiar dades».')}}
function importFile(e){var f=e.target.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){try{var d=JSON.parse(rd.result);if(!d||!Array.isArray(d.moves))throw 0;S=d;S.sample=false;S.settings=Object.assign(defaults(),S.settings||{});S.filed=S.filed||{};commit('Còpia restaurada: '+S.moves.length+' moviments')}catch(err){toast('Aquest fitxer no és una còpia de Samyama Comptes')}};rd.readAsText(f)}

/* ---------- Full de moviment ---------- */
function openSheet(id){
  var m=id?S.moves.filter(function(x){return x.id===id})[0]:null;UI.editing=m||null;
  $('#sheetTitle').textContent=m?'Editar moviment':'Nou moviment';
  UI.type=m?m.t:(UI.filter==='out'?'out':'in');UI.iva=m?m.iva:(UI.type==='in'?S.settings.ivaDef:21);UI.ret=m?m.ret:0;
  $('#f-amount').value=m?String(m.base).replace('.',','):'';$('#f-incl').checked=false;
  $('#f-date').value=m?m.d:(yr()===CY?iso(TODAY):yr()+'-12-31');$('#f-concept').value=m?m.c:'';$('#f-party').value=m?m.p:'';
  $('#f-paid').checked=m?m.paid:true;$('#f-ded').checked=m?m.ded:true;
  $('#delBtn').hidden=!m;$('#delBtn').classList.remove('arm');$('#delBtn').textContent='Eliminar';
  syncType(m?m.cat:null);$('#sheetWrap').hidden=false;document.body.style.overflow='hidden';
  setTimeout(function(){if(!m)$('#f-amount').focus()},250);
}
function closeSheet(){$('#sheetWrap').hidden=true;document.body.style.overflow='';UI.editing=null}
function syncType(cat){var t=UI.type;
  $('#f-type-in').setAttribute('aria-pressed',t==='in');$('#f-type-out').setAttribute('aria-pressed',t==='out');
  $('#f-cat').innerHTML=CATS[t].map(function(c){return '<option'+(c===cat?' selected':'')+'>'+esc(c)+'</option>'}).join('');
  $('#paidRow').hidden=t!=='in';$('#dedRow').hidden=t!=='out';
  $('#partyLab').textContent=t==='in'?'Client':'Proveïdor';
  $('#retLab').textContent=t==='in'?'Retenció que et practiquen':'Retenció que practiques tu';
  var ps={};S.moves.forEach(function(m){if(m.t===t&&m.p)ps[m.p]=1});$('#parties').innerHTML=Object.keys(ps).sort().map(function(p){return '<option value="'+esc(p)+'">'}).join('');
  drawOpts();}
function drawOpts(){
  $('#f-iva').innerHTML=[21,10,4,0].map(function(v){return '<button type="button" class="opt" data-iva="'+v+'" aria-pressed="'+(UI.iva===v)+'">'+(v?v+'%':'Exempt')+'</button>'}).join('');
  var rets=UI.type==='in'?[0,7,15]:[0,15,19];if(rets.indexOf(UI.ret)<0)rets.push(UI.ret);
  $('#f-ret').innerHTML=rets.map(function(v){return '<button type="button" class="opt" data-ret="'+v+'" aria-pressed="'+(UI.ret===v)+'">'+(v?v+'%':'Cap')+'</button>'}).join('');
  preview();}
function curBase(){var a=parseNum($('#f-amount').value);if(isNaN(a))return 0;return $('#f-incl').checked?r2(a/(1+UI.iva/100)):a}
function preview(){var b=curBase(),iv=r2(b*UI.iva/100),rt=r2(b*UI.ret/100);var inn=UI.type==='in';
  $('#f-prev').innerHTML='<span class="k">Base imposable</span><span class="v">'+eur(b)+'</span><span class="k">IVA '+UI.iva+'%</span><span class="v">+'+eur(iv)+'</span>'+
   (UI.ret?'<span class="k">Retenció IRPF '+UI.ret+'%</span><span class="v">−'+eur(rt)+'</span>':'')+
   '<span class="k t">'+(inn?'Cobres':'Pagues')+'</span><span class="v t">'+eur(b+iv-rt)+'</span>';}
function catDefaults(){var c=$('#f-cat').value;
  if(c===RENT){UI.iva=21;UI.ret=19}else if(c==='Institucions'){UI.iva=S.settings.ivaDef;UI.ret=S.settings.retDef}
  else if(c==='Assegurances'){UI.iva=0;UI.ret=0}else if(UI.type==='in'){UI.ret=0}else if(UI.ret===19){UI.ret=0}
  drawOpts();}
function partyDefaults(){var p=$('#f-party').value.trim();if(!p||UI.editing)return;
  var last=S.moves.filter(function(m){return m.t===UI.type&&m.p===p})[0];if(!last)return;
  UI.iva=last.iva;UI.ret=last.ret;$('#f-cat').value=last.cat;if(!$('#f-concept').value)$('#f-concept').value=last.c.replace(/·.*$/,'').trim();drawOpts();}

/* ---------- Esdeveniments ---------- */
function commit(msg){save();render();if(msg)toast(msg)}
var toastT;function toast(msg,act){var t=$('#toast');$('#toastMsg').textContent=msg;var b=$('#toastAct');b.hidden=!act;b.onclick=act?function(){act();t.hidden=true}:null;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true},act?7000:2600)}
function go(v){if(['resum','moviments','impostos','ajustos'].indexOf(v)<0)v='resum';if(v!==UI.view)UI.sel=null;UI.view=v;
  $$('.view').forEach(function(s){s.hidden=s.dataset.view!==v});$$('.tab').forEach(function(t){t.setAttribute('aria-current',t.dataset.go===v?'page':'false')});
  $('#fab').hidden=v==='ajustos';render();window.scrollTo(0,0);}
function render(){
  var ys={};ys[CY]=1;S.moves.forEach(function(m){ys[m.d.slice(0,4)]=1});ys[S.settings.year]=1;
  $('#yearSel').innerHTML=Object.keys(ys).sort().reverse().map(function(y){return '<option'+(+y===yr()?' selected':'')+'>'+y+'</option>'}).join('');
  $('#sampleBanner').hidden=!S.sample;
  ({resum:renderResum,moviments:renderMoviments,impostos:renderImpostos,ajustos:renderAjustos})[UI.view]();syncSel();}

document.addEventListener('click',function(e){var t=e.target.closest('[data-go],[data-f],[data-id],[data-del],[data-q],[data-file],[data-set],[data-act],[data-iva],[data-ret],[data-type]');
  if(UI.open&&(!t||!(t.dataset.del||t===UI.open))){closeRow();if(t&&t.dataset.id)return}
  if(!t)return;
  if(t.dataset.go){location.hash=t.dataset.go;return}
  if(t.dataset.f){UI.filter=t.dataset.f;renderMoviments();return}
  if(t.dataset.del){removeIds([t.dataset.del]);return}
  if(t.dataset.id){if(t.dataset.swiped)return;
    if(UI.sel){if(UI.sel[t.dataset.id])delete UI.sel[t.dataset.id];else UI.sel[t.dataset.id]=1;var on=!!UI.sel[t.dataset.id];t.classList.toggle('on',on);t.setAttribute('aria-pressed',on);syncSel();return}
    if(UI.open===t){closeRow();return}
    openSheet(t.dataset.id);return}
  if(t.dataset.q){UI.tq=+t.dataset.q;renderImpostos();return}
  if(t.dataset.file){var k=t.dataset.file;if(S.filed[k])delete S.filed[k];else S.filed[k]=true;commit(S.filed[k]?'Model '+k.split('-')[2]+' marcat com a presentat':null);return}
  if(t.dataset.set){S.settings[t.dataset.set]=+t.dataset.v;commit();return}
  if(t.dataset.act==='new'){openSheet();return}
  if(t.dataset.iva!==undefined){UI.iva=+t.dataset.iva;drawOpts();return}
  if(t.dataset.ret!==undefined){UI.ret=+t.dataset.ret;drawOpts();return}
  if(t.dataset.type){UI.type=t.dataset.type;UI.iva=UI.type==='in'?S.settings.ivaDef:21;UI.ret=0;syncType();return}
});
$('#fab').addEventListener('click',function(){openSheet()});
$('#closeSheet').addEventListener('click',closeSheet);
$('#sheetWrap').addEventListener('click',function(e){if(e.target.id==='sheetWrap')closeSheet()});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!$('#sheetWrap').hidden)closeSheet()});
$('#f-amount').addEventListener('input',preview);$('#f-incl').addEventListener('change',preview);
$('#f-cat').addEventListener('change',catDefaults);$('#f-party').addEventListener('change',partyDefaults);
$('#yearSel').addEventListener('change',function(e){S.settings.year=+e.target.value;UI.tq=null;commit()});
$('#startClean').addEventListener('click',function(){var snap=S;S={v:1,sample:false,moves:[],filed:{},settings:defaults()};UI.tq=null;save();render();toast('Llest. Afegeix el teu primer moviment amb el +',function(){S=snap;commit('Exemple recuperat')})});
$('#mvForm').addEventListener('submit',function(e){e.preventDefault();
  var a=parseNum($('#f-amount').value);if(isNaN(a)||a<=0){toast('Escriu un import més gran que zero');$('#f-amount').focus();return}
  var d=$('#f-date').value;if(!d){toast('Tria una data');return}
  var c=$('#f-concept').value.trim();if(!c){toast('Escriu un concepte');$('#f-concept').focus();return}
  var m=UI.editing||{id:uid()};var isNew=!UI.editing;
  Object.assign(m,{t:UI.type,d:d,c:c,p:$('#f-party').value.trim(),cat:$('#f-cat').value,base:curBase(),iva:UI.iva,ret:UI.ret,paid:UI.type==='in'?$('#f-paid').checked:true,ded:UI.type==='out'?$('#f-ded').checked:true});
  if(isNew)S.moves.unshift(m);
  if(S.sample&&isNew){/* primer moviment propi: segueix amb exemple fins que l'usuari comenci de zero */}
  var y=+d.slice(0,4);if(y!==yr())S.settings.year=y;
  closeSheet();commit(isNew?(m.t==='in'?'Ingrés desat':'Despesa desada'):'Canvis desats');});
$('#delBtn').addEventListener('click',function(){var b=$('#delBtn');
  if(!b.classList.contains('arm')){b.classList.add('arm');b.textContent='Confirma: eliminar';return}
  var m=UI.editing;if(!m)return;closeSheet();removeIds([m.id]);});
$('#selAll').addEventListener('click',function(){var all=UI.visible.every(function(id){return UI.sel[id]});UI.sel={};if(!all)UI.visible.forEach(function(id){UI.sel[id]=1});renderMoviments()});
$('#selCancel').addEventListener('click',function(){UI.sel=null;renderMoviments()});
$('#selDel').addEventListener('click',function(){var b=$('#selDel'),ids=Object.keys(UI.sel);if(!ids.length)return;
  if(!b.classList.contains('arm')){b.classList.add('arm');b.textContent='Confirma ('+ids.length+')';return}
  UI.sel=null;removeIds(ids);});
window.addEventListener('hashchange',function(){go(location.hash.slice(1))});
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferredPrompt=e;var r=$('#installRow');if(r)r.hidden=false});

/* ---------- Inici ---------- */
load();go(location.hash.slice(1)||'resum');
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)&&document.querySelector('link[rel="manifest"]')){try{navigator.serviceWorker.register('sw.js').catch(function(){})}catch(e){}}
window.__SC={m303:m303,m130:m130,mRet:mRet,yearSummary:yearSummary,reserve:reserve,deadline:deadline,irpfAnual:irpfAnual,state:function(){return S}};
})();
</script>
